  <rect x="64" y="64" width="1072" height="502" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="104" y="108" width="64" height="64" rx="14" fill="#2563eb"/>
  <path d="M124 128h24M124 140h24M124 152h16" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="188" y="148" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="700" fill="#0f172a">SQL Trainer</text>
  <text x="104" y="226" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800" fill="#0f172a">Interaktiv SQL &amp; MySQL üben</text>
  <text x="104" y="282" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#475569">Direkt im Browser mit WebAssembly – kostenlos, ohne Anmeldung.</text>
  <rect x="104" y="330" width="992" height="170" rx="12" fill="#0f172a"/>
  <text x="132" y="378" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">SELECT</text>
  <text x="228" y="378" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> s.name, COUNT(b.id) AS anzahl</text>
  <text x="132" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">FROM</text>
  <text x="200" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> schueler s </text>
  <text x="358" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">LEFT JOIN</text>
  <text x="492" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> ausleihen b </text>
  <text x="662" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">ON</text>
  <text x="702" y="416" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> s.id = b.schueler_id</text>
  <text x="132" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">GROUP BY</text>
  <text x="254" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> s.id </text>
  <text x="334" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">ORDER BY</text>
  <text x="456" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0"> anzahl </text>
  <text x="562" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#38bdf8">DESC</text>
  <text x="616" y="454" font-family="JetBrains Mono, monospace" font-size="22" fill="#94a3b8">;</text>
