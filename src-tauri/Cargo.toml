[package]
name = "sql-trainer"
version = "1.0.1"
description = "Interaktiver SQL-Trainer (MySQL & SQLite) für Schule, Abitur und Studium"
authors = ["Eren Kazokoglu <info@best-tools.app>"]
edition = "2021"

[lib]
name = "sql_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
